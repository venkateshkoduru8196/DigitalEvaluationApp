name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT REPOSITORY
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # FRONTEND
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend
        working-directory: ./DigitalEvaluationReact
        run: npm install

      - name: Build Frontend
        working-directory: ./DigitalEvaluationReact
        run: npm run build

      # =========================
      # COPY FRONTEND TO BACKEND
      # =========================
      - name: Copy Frontend to Backend
        shell: cmd
        run: |
          if exist DIGITALEVALUATIONAPT\wwwroot rmdir /s /q DIGITALEVALUATIONAPT\wwwroot
          mkdir DIGITALEVALUATIONAPT\wwwroot
          xcopy /E /I /Y DigitalEvaluationReact\dist DIGITALEVALUATIONAPT\wwwroot

      # =========================
      # BACKEND
      # =========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Backend
        working-directory: ./DIGITALEVALUATIONAPT
        run: dotnet restore

      - name: Publish Backend
        working-directory: ./DIGITALEVALUATIONAPT
        run: dotnet publish -c Release -o ./publish

      # =========================
      # FTP DEPLOY
      # =========================
      - name: Deploy to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./DIGITALEVALUATIONAPT/publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
