name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT CODE
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # INSTALL FRONTEND
      # =========================
      - name: Install Frontend Dependencies
        working-directory: ./DigitalEvaluationReact
        run: npm install

      # =========================
      # BUILD FRONTEND
      # =========================
      - name: Build Frontend
        working-directory: ./DigitalEvaluationReact
        run: npm run build

      # =========================
      # COPY FRONTEND DIST TO BACKEND WWWROOT
      # =========================
      - name: Copy Frontend to Backend
        shell: cmd
        run: |
          if exist DIGITALEVALUATIONAPT\wwwroot rmdir /s /q DIGITALEVALUATIONAPT\wwwroot
          mkdir DIGITALEVALUATIONAPT\wwwroot
          xcopy /E /I /Y DigitalEvaluationReact\dist DIGITALEVALUATIONAPT\wwwroot

      # =========================
      # SETUP .NET
      # =========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # =========================
      # RESTORE BACKEND
      # =========================
      - name: Restore Backend Dependencies
        working-directory: ./DIGITALEVALUATIONAPT
        run: dotnet restore

      # =========================
      # PUBLISH BACKEND
      # =========================
      - name: Publish Backend
        working-directory: ./DIGITALEVALUATIONAPT
        run: dotnet publish -c Release -o ./publish

      # =========================
      # DEPLOY TO HOSTING
      # =========================
      - name: Deploy to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./DIGITALEVALUATIONAPT/publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
